<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · não existe</title>
<link rel="stylesheet" href="/e/assets/estilo.css">
</head>
<body>
<header><span class="marca">locaus.fun</span><span>404</span></header>
<main>
  <h1 style="font-size:clamp(48px,12vw,140px);letter-spacing:.3em">404</h1>
  <p class="sub">esta página não existe</p>

  <section class="folha" style="text-align:center">
    <p>Mas já que estás aqui, o erro deixou um código:</p>
    <p style="font-family:'Cascadia Mono',Consolas,monospace;font-size:clamp(20px,4vw,34px);
              letter-spacing:.28em;color:#ffb199;margin:18px 0">
      ERR-{{CODIGO}}
    </p>
    <p>Escreve só os números na caixa. A casa continua.</p>
    <div class="nota" style="text-align:left">em dúvida? escreve <code>ajuda</code> na consola (F12).</div>
  </section>

  <div class="linha">
    <input class="campo" id="valor" inputmode="numeric" autocomplete="off" spellcheck="false">
    <button class="botao brasa" id="ok">confirmar</button>
  </div>

  <div class="saida" id="saida"></div>
  <div class="chapa" id="chapa"></div>
</main>
<footer><span>erro 404</span><span>locaus.fun</span></footer>
<div class="toast" id="toast"></div>

<script src="/e/assets/enigma.js"></script>
<script>
  progresso(5);

    registarAjuda(function () {
    console.log("%cAJUDA :: 404", "color:#e63946;font-weight:bold");
    console.log("  a pagina nao existe, mas o erro deixou um codigo.");
    console.log("  tem numeros.");
  });

  var saida = document.getElementById('saida');

  document.getElementById('ok').addEventListener('click', function () {
    var v = document.getElementById('valor').value.trim();
    if (!v) { saida.className = 'saida mau'; saida.textContent = 'o código tem números.'; return; }

    api('responder', { etapa: 5, valor: v }).then(function (d) {
      if (d.ok && d.url) {
        saida.className = 'saida bom';
        saida.textContent = 'o erro cedeu.';
        mostrarLink(d.url);
      } else {
        saida.className = 'saida mau';
        saida.textContent = 'não é esse número.';
      }
    });
  });

  document.getElementById('valor').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('ok').click();
  });
</script>
</body>
</html>
