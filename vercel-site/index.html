<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashow e Jazer — Em breve</title>
  <meta name="description" content="O site Ashow e Jazer está em desenvolvimento e abre em breve." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- as mesmas fontes do site: Archivo (títulos) + Inter (texto) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --violeta: #8b5cf6;
      --violeta-escuro: #6d28d9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* fundo: gif animado (com véu escuro para o texto continuar legível) */
    .fundo {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #000 url('https://i.pinimg.com/originals/45/98/6d/45986d3cf4d64299869db2be4704719e.gif') center center / cover no-repeat;
    }
    .fundo::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 35%, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.85) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.25) 45%, rgba(0, 0, 0, 0.8) 100%);
    }

    /* brilhos violeta (como no site) — por cima do gif */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 60vmax; height: 60vmax;
      top: -22vmax; left: -18vmax;
      background: radial-gradient(circle, var(--violeta) 0%, transparent 65%);
    }
    body::after {
      width: 55vmax; height: 55vmax;
      bottom: -24vmax; right: -18vmax;
      background: radial-gradient(circle, var(--violeta-escuro) 0%, transparent 65%);
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.25rem;
      text-align: center;
    }

    h1 {
      font-family: 'Archivo', 'Inter', sans-serif;
      font-stretch: semi-expanded;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.92;
      font-size: clamp(2.8rem, 13vw, 6rem);
      background: linear-gradient(135deg, #ede9fe 0%, var(--violeta) 55%, var(--violeta-escuro) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 0 1.25rem 3.5rem;
      text-align: center;
    }

    .emBreve {
      font-family: 'Archivo', 'Inter', sans-serif;
      font-stretch: semi-expanded;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: clamp(0.15em, 4vw, 0.4em);
      font-size: clamp(1.5rem, 7vw, 3.25rem);
      color: transparent;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(139, 92, 246, 0.22) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      margin-bottom: 1.5rem;
    }

    .creditos { color: #52525b; font-size: 0.8rem; line-height: 1.7; }
    .creditos b { color: #a1a1aa; font-weight: 700; }

    /* loading simples: um anel violeta a girar */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .loading-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(139, 92, 246, 0.22);
      border-top-color: var(--violeta);
      animation: girar 0.7s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* pequeno link para escrever o código */
    .codigo {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.18s ease;
    }
    .codigo:hover { color: #c4b5fd; }
    .codigo svg { width: 11px; height: 11px; }
  </style>
</head>

<body>
  <div class="fundo" aria-hidden="true"></div>
  <main>
    <h1>Ashow e Jazer</h1>
  </main>

  <footer>
    <h2 class="emBreve">Em breve</h2>
    <div class="loading" aria-hidden="true">
      <div class="loading-ring"></div>
    </div>
    <button class="codigo" type="button" aria-label="escrever código">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      escrever código
    </button>
    <p class="creditos" style="margin-top: 1rem;">Versão para telemóvel ainda em melhoria contínua.</p>
  </footer>
</body>
</html>
