<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashow e Jazer — Em breve</title>
  <meta name="description" content="O site Ashow e Jazer está em desenvolvimento e abre em breve." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- as mesmas fontes do site: Archivo (títulos) + Inter (texto) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --violeta: #8b5cf6;
      --violeta-escuro: #6d28d9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* fundo: brilhos violeta (como no site) */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.22;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 60vmax; height: 60vmax;
      top: -22vmax; left: -18vmax;
      background: radial-gradient(circle, var(--violeta) 0%, transparent 65%);
    }
    body::after {
      width: 55vmax; height: 55vmax;
      bottom: -24vmax; right: -18vmax;
      background: radial-gradient(circle, var(--violeta-escuro) 0%, transparent 65%);
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.25rem;
      text-align: center;
    }

    h1 {
      font-family: 'Archivo', 'Inter', sans-serif;
      font-stretch: semi-expanded;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.92;
      font-size: clamp(2.8rem, 13vw, 6rem);
      background: linear-gradient(135deg, #ede9fe 0%, var(--violeta) 55%, var(--violeta-escuro) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 0 1.25rem 3.5rem;
      text-align: center;
    }

    .emBreve {
      font-family: 'Archivo', 'Inter', sans-serif;
      font-stretch: semi-expanded;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: clamp(0.15em, 4vw, 0.4em);
      font-size: clamp(1.5rem, 7vw, 3.25rem);
      color: transparent;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(139, 92, 246, 0.22) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      margin-bottom: 1.5rem;
    }

    .creditos { color: #52525b; font-size: 0.8rem; line-height: 1.7; }
    .creditos b { color: #a1a1aa; font-weight: 700; }

    .youtube {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.9rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d4d4d8;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .youtube:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .youtube svg { width: 14px; height: 14px; }
  </style>
</head>

<body>
  <main>
    <h1>Ashow e Jazer</h1>
  </main>

  <footer>
    <h2 class="emBreve">Em breve</h2>
    <p class="creditos">Criado por <b>xalana</b></p>
    <a class="youtube" href="https://www.youtube.com/@AshoweJazer" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/>
      </svg>
      Ashow e Jazer no YouTube
    </a>
  </footer>
</body>
</html>
