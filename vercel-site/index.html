<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashow e Jazer — Em breve</title>
  <meta name="description" content="O site Ashow e Jazer está em desenvolvimento e abre em breve." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --violet: #8b5cf6;
      --violet-dark: #7c3aed;
      --bg: #08080d;
      --panel: rgba(255, 255, 255, 0.04);
      --line: rgba(139, 92, 246, 0.25);
      --muted: #8a8a99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #e7e7ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Brilho violeta flutuante */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
    }
    .glow.a {
      width: 40rem; height: 40rem;
      background: rgba(139, 92, 246, 0.16);
      top: -12rem; left: -10rem;
      animation: drift 18s ease-in-out infinite;
    }
    .glow.b {
      width: 32rem; height: 32rem;
      background: rgba(124, 58, 237, 0.14);
      bottom: -10rem; right: -8rem;
      animation: drift 22s ease-in-out infinite reverse;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(3rem, 2rem) scale(1.08); }
    }

    .wrap { position: relative; z-index: 1; max-width: 34rem; width: 100%; }

    /* Marca */
    .mark {
      width: 62px; height: 62px;
      margin: 0 auto 22px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-dark) 100%);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.45);
      font-weight: 900;
      font-size: 30px;
      color: #fff;
      letter-spacing: -1px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid var(--line);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 26px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.55); }
      70%  { box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 3.1rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fff 20%, var(--violet) 60%, #c4b5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    p.lead {
      font-size: 15px;
      line-height: 1.7;
      color: #b9b9c8;
      margin-bottom: 30px;
    }
    p.lead strong { color: #fff; font-weight: 700; }

    /* Barra de progresso decorativa */
    .bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin-bottom: 34px;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--violet-dark), var(--violet), #c4b5fd);
      background-size: 200% 100%;
      animation: slide 3.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { margin-left: -45%; }
      100% { margin-left: 100%; }
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px 20px;
      backdrop-filter: blur(6px);
    }
    .card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .card p + p { margin-top: 6px; }

    /* Créditos */
    footer {
      position: relative;
      z-index: 1;
      margin-top: 42px;
      font-size: 11.5px;
      color: #5c5c6b;
      line-height: 1.9;
    }
    footer a {
      color: #a1a1b3;
      text-decoration: none;
      border-bottom: 1px solid rgba(161, 161, 179, 0.25);
      transition: color 0.2s, border-color 0.2s;
    }
    footer a:hover { color: var(--violet); border-color: var(--violet); }
    .yt { display: inline-flex; align-items: center; gap: 5px; }

    @media (prefers-reduced-motion: reduce) {
      .glow, .dot, .bar span { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <main class="wrap">
    <div class="mark">A</div>

    <span class="pill"><span class="dot"></span> Em desenvolvimento</span>

    <h1>Ashow e Jazer</h1>

    <p class="lead">
      Estamos a acabar os últimos detalhes do site.
      <strong>Abre em breve.</strong>
    </p>

    <div class="bar"><span></span></div>

    <div class="card">
      <p>Clips, notícias dos jogos e tudo o resto dos Locaus.</p>
      <p>Já falta pouco — obrigado pela paciência.</p>
    </div>
  </main>

  <footer>
    <div>Criado por <a href="https://www.youtube.com/@ashowejazer" target="_blank" rel="noopener">xalana</a></div>
    <div>
      <a class="yt" href="https://www.youtube.com/@ashowejazer" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/>
        </svg>
        Canal no YouTube
      </a>
    </div>
  </footer>
</body>
</html>
