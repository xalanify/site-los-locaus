<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashow e Jazer — Em breve</title>
  <meta name="description" content="O site Ashow e Jazer está em desenvolvimento e abre em breve." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Título: gótica/blackletter (estilo Demonseason) -->
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturMaguntia&family=Grenze+Gotisch:wght@700;900&family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --violet: #8b5cf6;
      --violet-dark: #7c3aed;
      --bg: #05050a;
      --panel: rgba(255, 255, 255, 0.035);
      --line: rgba(139, 92, 246, 0.28);
      --muted: #8a8a99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      /* Resto das fontes: Archivo (mesmo tipo da foto de exemplo) */
      font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #e7e7ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ---------- brilho de fundo ---------- */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(115px);
      pointer-events: none;
      z-index: 0;
    }
    .glow.a {
      width: 40rem; height: 40rem;
      background: rgba(139, 92, 246, 0.15);
      top: -12rem; left: -10rem;
      animation: drift 18s ease-in-out infinite;
    }
    .glow.b {
      width: 32rem; height: 32rem;
      background: rgba(124, 58, 237, 0.13);
      bottom: -10rem; right: -8rem;
      animation: drift 22s ease-in-out infinite reverse;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(3rem, 2rem) scale(1.08); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 36rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- balão ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid var(--line);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 34px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--violet);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.55); }
      70%  { box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    /* ---------- TÍTULO (gótica + segue o rato) ---------- */
    .title {
      font-family: 'Pirata One', 'UnifrakturMaguntia', serif;
      font-weight: 400;
      font-size: clamp(3rem, 13vw, 6.2rem);
      line-height: 1;
      letter-spacing: 0.01em;
      color: #ffffff;
      /* aspeto metalizado/brilho à semelhança da imagem */
      text-shadow:
        0 0 16px rgba(255, 255, 255, 0.28),
        0 0 34px rgba(139, 92, 246, 0.55),
        0 0 70px rgba(124, 58, 237, 0.38),
        0 3px 0 rgba(0, 0, 0, 0.75);
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.16s ease-out;
      margin-bottom: 26px;
      user-select: none;
      white-space: nowrap;
    }
    .title span { display: inline-block; }

    /* ---------- frase ---------- */
    .lead {
      font-family: 'Archivo', sans-serif;
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #c4b5fd;
      margin-bottom: 34px;
    }

    /* ---------- cartão ---------- */
    .card {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 20px 22px;
      backdrop-filter: blur(6px);
    }
    .card p {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9c9cae;
      line-height: 1.75;
    }

    /* ---------- créditos ---------- */
    footer {
      position: relative;
      z-index: 1;
      margin-top: 46px;
      font-size: 11.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #55555f;
      line-height: 2.1;
    }
    footer .nome {
      color: #ffffff;               /* branco, sem link */
      font-weight: 800;
      letter-spacing: 0.14em;
    }
    footer a {
      color: #8f8fa3;
      text-decoration: none;
      border-bottom: 1px solid rgba(143, 143, 163, 0.3);
      transition: color 0.2s, border-color 0.2s;
    }
    footer a:hover { color: var(--violet); border-color: var(--violet); }
    .yt { display: inline-flex; align-items: center; gap: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .glow, .dot { animation: none; }
      .title { transition: none; }
    }
  </style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <main class="wrap">
    <span class="pill"><span class="dot"></span> Em desenvolvimento</span>

    <h1 class="title" id="titulo">Ashow e Jazer</h1>

    <p class="lead">Abre em breve</p>

    <div class="card">
      <p>Clips antigos privados · Publicação de clips · Estatísticas dos nossos jogos · E mais dos Locaus</p>
    </div>
  </main>

  <footer>
    <div>Criado por <span class="nome">xalana</span></div>
    <div>
      <a class="yt" href="https://www.youtube.com/@ashowejazer" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/>
        </svg>
        Canal no YouTube
      </a>
    </div>
  </footer>

  <script>
    // O título "olha" para o rato: gira na direção onde o cursor está.
    (function () {
      var titulo = document.getElementById('titulo');
      if (!titulo) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (!window.matchMedia('(hover: hover)').matches) return; // toque: sem efeito

      var raf = 0, alvoX = 0, alvoY = 0, atualX = 0, atualY = 0;

      function animar() {
        // suavização
        atualX += (alvoX - atualX) * 0.12;
        atualY += (alvoY - atualY) * 0.12;
        titulo.style.transform =
          'perspective(900px) rotateY(' + atualX.toFixed(2) + 'deg) ' +
          'rotateX(' + atualY.toFixed(2) + 'deg)';
        if (Math.abs(alvoX - atualX) > 0.05 || Math.abs(alvoY - atualY) > 0.05) {
          raf = requestAnimationFrame(animar);
        } else {
          raf = 0;
        }
      }

      window.addEventListener('mousemove', function (e) {
        var cx = window.innerWidth / 2;
        var cy = window.innerHeight / 2;
        alvoX = ((e.clientX - cx) / cx) * 16;   // esquerda/direita
        alvoY = -((e.clientY - cy) / cy) * 10;  // cima/baixo
        if (!raf) raf = requestAnimationFrame(animar);
      }, { passive: true });

      document.addEventListener('mouseleave', function () {
        alvoX = 0; alvoY = 0;
        if (!raf) raf = requestAnimationFrame(animar);
      });
    })();
  </script>
</body>
</html>
