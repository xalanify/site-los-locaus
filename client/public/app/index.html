<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCAUS PC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 60px 50px;
    width: 420px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 32px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn { from {opacity:0; transform: translateY(12px);} to {opacity:1; transform: translateY(0);} }
  h1 {
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, #a78bfa, #c084fc, #e879f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: rgba(255,255,255,0.6); margin-top: 6px; font-size: 14px; }
  .btn {
    margin-top: 36px;
    width: 100%;
    padding: 16px 0;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #fff;
  }
  .btn-on { background: linear-gradient(90deg, #8b5cf6, #a855f7); box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
  .btn-on:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(139,92,246,0.45); }
  .btn-off { background: linear-gradient(90deg, #ef4444, #dc2626); box-shadow: 0 8px 24px rgba(239,68,68,0.35); }
  .btn-off:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(239,68,68,0.45); }
  .status {
    margin-top: 24px;
    font-size: 13px;
    min-height: 22px;
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
  .dot-off { background: #ef4444; }
  .dot-on { background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
</style>
</head>
<body>
<div class="card">
  <h1>LOCAUS PC</h1>
  <p class="subtitle">Agente local conectado ao site</p>
  <button class="btn btn-on" id="btn" onclick="toggle()">LIGAR AO SITE</button>
  <div class="status" id="status">
    <span class="dot dot-off"></span> DESLIGADO — Clica para ligar
  </div>
</div>

<script>
  let ligado = false;
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');

  async function toggle() {
    ligado = !ligado;
    if (ligado) {
      btn.textContent = 'DESLIGAR';
      btn.className = 'btn btn-off';
      status.innerHTML = '<span class="dot dot-on"></span> LIGADO — Site detectado';
      // Inicia o .bat atualizado
      try {
        window.api?.startAgent?.();
      } catch(e){}
      // Inicia o .bat diretamente
      const bat = 'ligar.bat';
      if (window.api && window.api.startAgent) window.api.startAgent();
    } else {
      btn.textContent = 'LIGAR AO SITE';
      btn.className = 'btn btn-on';
      status.innerHTML = '<span class="dot dot-off"></span> DESLIGADO — Clica para ligar';
    }
  }

  // Poll simples
  setInterval(async () => {
    if (!ligado) return;
    try {
      const r = await fetch('https://locaus.vercel.app/api/agente/ping');
      const d = await r.json();
      if (d.online) status.innerHTML = '<span class="dot dot-on"></span> [LIGADO] Site conectado — tudo ativo';
    } catch(e) {}
  }, 3000);
</script>
</body>
</html>
