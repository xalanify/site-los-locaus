<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <style>
    @keyframes shock { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.2) rotate(2deg); } }
    .s { animation: shock .7s ease-in-out infinite; transform-origin: 120px 130px; }
  </style>
  <text x="120" y="168" text-anchor="middle" font-size="130" class="s">😱</text>
</svg>
