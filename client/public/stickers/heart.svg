<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <style>
    @keyframes heart { 0%,100% { transform: scale(1); } 25% { transform: scale(1.18); } 50% { transform: scale(.96); } 75% { transform: scale(1.12); } }
    .s { animation: heart 1.2s ease-in-out infinite; transform-origin: 120px 130px; }
  </style>
  <text x="120" y="168" text-anchor="middle" font-size="130" class="s">❤️</text>
</svg>
