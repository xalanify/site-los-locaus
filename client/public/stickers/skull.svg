<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <style>
    @keyframes skull { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.1); } }
    .s { animation: skull .9s ease-in-out infinite; transform-origin: 120px 130px; }
  </style>
  <text x="120" y="168" text-anchor="middle" font-size="130" class="s">💀</text>
</svg>
