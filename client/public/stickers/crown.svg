<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <style>
    @keyframes crown { 0%,100% { transform: translateY(0) rotate(-6deg); filter: drop-shadow(0 0 6px #fbbf24); } 50% { transform: translateY(-12px) rotate(6deg); filter: drop-shadow(0 0 20px #fbbf24); } }
    .s { animation: crown 1s ease-in-out infinite; transform-origin: 120px 130px; }
  </style>
  <text x="120" y="168" text-anchor="middle" font-size="130" class="s">👑</text>
</svg>
