<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <style>
    @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg) scale(1); } 50% { transform: translateY(-14px) rotate(4deg) scale(1.06); } }
    .s { animation: bounce 1.1s ease-in-out infinite; transform-origin: 120px 120px; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  </defs>
  <text x="120" y="158" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="96" font-weight="900" fill="url(#g)" stroke="#ffffff" stroke-width="4" class="s">GG</text>
</svg>
